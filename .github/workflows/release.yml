name: Release Creation

on:
  push:
    tags:
      - 'v*'
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Get Version / Tag
        id: get_version
        run: |
          TAG_NAME=${GITHUB_REF#refs/tags/}
          if [[ "$TAG_NAME" == "refs/heads/"* ]] || [[ -z "$TAG_NAME" ]]; then
            TAG_NAME="v$(node -p "require('./module.json').version")"
          fi
          VERSION=${TAG_NAME#v}
          echo "tag_name=$TAG_NAME" >> $GITHUB_OUTPUT
          echo "version=$VERSION" >> $GITHUB_OUTPUT

      - name: Update module.json Version and Download URL
        run: |
          TAG_NAME="${{ steps.get_version.outputs.tag_name }}"
          VERSION="${{ steps.get_version.outputs.version }}"
          node -e '
            const fs = require("fs");
            const mod = JSON.parse(fs.readFileSync("module.json", "utf8"));
            mod.version = "'"$VERSION"'";
            mod.download = `https://github.com/LPfontes/lancer-action-hud/releases/download/${"'"$TAG_NAME"'"}/module.zip`;
            fs.writeFileSync("module.json", JSON.stringify(mod, null, 2));
          '

      - name: Zip Module Files
        run: |
          zip -r module.zip module.json scripts templates styles lang README.md

      - name: Create GitHub Release
        uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.get_version.outputs.tag_name }}
          name: Release ${{ steps.get_version.outputs.tag_name }}
          draft: false
          prerelease: false
          generate_release_notes: true
          files: |
            module.json
            module.zip
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
